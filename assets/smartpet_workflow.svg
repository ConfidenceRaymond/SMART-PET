<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" role="img" aria-labelledby="title desc">
<title id="title">SMART-PET production workflow</title>
<desc id="desc">Paired MNI PET volumes are validated, sampled into paired patches, trained with the SMART-PET generator and conditional discriminator, and reconstructed at inference with overlapping Hann-weighted patches.</desc>
<defs><style>.box{fill:#f7f9fc;stroke:#263238;stroke-width:2}.title{font:700 26px sans-serif;fill:#102027}.text{font:18px sans-serif;fill:#263238}.small{font:15px sans-serif;fill:#455a64}.arrow{stroke:#263238;stroke-width:3;fill:none;marker-end:url(#m)}</style><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#263238"/></marker></defs>
<text x="700" y="45" text-anchor="middle" class="title">SMART-PET v0.3.0</text>
<rect x="40" y="120" width="240" height="180" rx="18" class="box"/><text x="160" y="160" text-anchor="middle" class="title">Data contract</text><text x="160" y="205" text-anchor="middle" class="text">Paired 3D NIfTI</text><text x="160" y="238" text-anchor="middle" class="text">same MNI geometry</text><text x="160" y="271" text-anchor="middle" class="small">asinh-normalized SUV</text>
<path d="M280 210 H360" class="arrow"/>
<rect x="360" y="100" width="280" height="220" rx="18" class="box"/><text x="500" y="140" text-anchor="middle" class="title">Training</text><text x="500" y="185" text-anchor="middle" class="text">paired 128³ crops</text><text x="500" y="218" text-anchor="middle" class="text">SSAB at 16³ and 8³</text><text x="500" y="251" text-anchor="middle" class="text">LSGAN + 100 × L1</text><text x="500" y="284" text-anchor="middle" class="small">single GPU or DDP</text>
<path d="M640 210 H720" class="arrow"/>
<rect x="720" y="100" width="280" height="220" rx="18" class="box"/><text x="860" y="140" text-anchor="middle" class="title">Inference</text><text x="860" y="185" text-anchor="middle" class="text">overlapping 128³ windows</text><text x="860" y="218" text-anchor="middle" class="text">50% stride by default</text><text x="860" y="251" text-anchor="middle" class="text">Hann-weighted blending</text><text x="860" y="284" text-anchor="middle" class="small">one model load per batch</text>
<path d="M1000 210 H1080" class="arrow"/>
<rect x="1080" y="120" width="280" height="180" rx="18" class="box"/><text x="1220" y="160" text-anchor="middle" class="title">Outputs</text><text x="1220" y="205" text-anchor="middle" class="text">normalized PET</text><text x="1220" y="238" text-anchor="middle" class="text">restored SUV PET</text><text x="1220" y="271" text-anchor="middle" class="small">JSON provenance + SHA-256</text>
<text x="700" y="395" text-anchor="middle" class="text">Exact resume restores complete training state; fine-tuning loads weights into a new run.</text><text x="700" y="435" text-anchor="middle" class="small">Clinical use requires independent validation. This repository is research software.</text>
</svg>